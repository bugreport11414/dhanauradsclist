.wrap{max-width:860px;margin:0 auto}

.hint{color:var(--mute);font-size:14px;margin:12px 4px}
.stat{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin:12px 4px}
.stat b{color:var(--ink)}
.res{margin:14px 4px 6px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;background:var(--g2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.kh{font-size:30px;font-weight:700;color:var(--g);line-height:1.1}
.kh small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.area{text-align:right}.area b{font-size:24px}.area small{display:block;color:var(--mute);font-size:13px}
.sec{padding:14px 18px;border-top:1px solid var(--line)}.sec:first-of-type{border-top:0}
.sec h3{margin:0 0 8px;font-size:15px;color:var(--mute);font-weight:500}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}
.own{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:0;padding:0;list-style:none}

.empty{text-align:center;padding:40px 10px;color:var(--mute)}
footer{color:var(--mute);font-size:13px;margin:26px 4px 40px}

const G={};
D.forEach(r=>{(G[r[0]]=G[r[0]]||[]).push(r)});
const keys=Object.keys(G).sort((a,b)=>a.localeCompare(b,'en',{numeric:true}));
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse=s=>{s=(s||'').trim();const p=s.split(/\(\d+\)\s*/).map(x=>x.trim()).filter(Boolean);return p};
const f3=n=>(+n).toFixed(3).replace(/\.?0+$/,'')||'0';
const tot=keys.reduce((a,k)=>a+(+G[k][0][1]||0),0);
document.getElementById('stat').innerHTML=`<span>कुल खसरा: <b>${keys.length}</b></span><span>कुल रकबा: <b>${tot.toFixed(2)} हेक्टेयर</b></span>`;
function card(k){
 const rows=G[k],r0=rows[0];
 const crops=rows.filter(r=>r[3]);
 let tb='';
 if(crops.length){tb=`<div class="sec"><h3>फसल की जानकारी</h3><div class="tw"><table><tr><th>फसल</th><th>कुल क्षेत्र</th><th>सिंचित</th><th>असिंचित</th><th>सिंचाई पद्धति</th></tr>`+
  crops.map(r=>`<tr><td>${E(r[3])}</td><td>${f3(r[4])}</td><td>${f3(r[5])}</td><td>${f3(r[6])}</td><td>${E(r[7]||'-')}</td></tr>`).join('')+`</table></div></div>`}
 else tb=`<div class="sec"><h3>फसल की जानकारी</h3>कोई फसल दर्ज नहीं</div>`;
 const o=parse(r0[8]),p=parse(r0[9]);
 const ol=o.map((n,i)=>`<li>${E(n)}<span>${p.length===o.length?'पिता/पति: '+E(p[i]):''}</span></li>`).join('');
 const extra=(p.length&&p.length!==o.length)?`<div class="sec"><h3>पिता/पति/माता का नाम</h3>${E(p.join(', '))}</div>`:'';
 const bad=/\?/.test(r0[8]+r0[9]+rows.map(r=>r[3]).join(''));
 return `<article class="card"><div class="top"><div class="kh"><small>खसरा नंबर</small>${E(k)}</div>
 <div class="area"><b>${f3(r0[1])}</b> ${E(r0[2]||'')}<small>खसरे का रकबा</small></div></div>
 ${bad?'<p class="warn">इस खसरे के कुछ नाम मूल फ़ाइल में अधूरे हैं (“?” वाले अक्षर)।</p>':''}
 <div class="sec"><h3>भू-स्वामी (${o.length})</h3>${o.length?`<ul class="own">${ol}</ul>`:'दर्ज नहीं'}</div>${extra}${tb}
 <div class="sec"><span class="badge">${E(r0[11]||'')}</span> <span style="color:var(--mute);font-size:13px">&nbsp;Flag: ${E(r0[10]||'-')}</span></div></article>`;
}
function run(){
 const q=document.getElementById('q').value.trim().replace(/\s+/g,'');
 const out=document.getElementById('out');
 if(!q){out.innerHTML='<div class="empty">ऊपर खसरा नंबर लिखिए। पूरी जानकारी यहाँ दिखेगी।</div>';return}
 const ex=keys.filter(k=>k===q);
 const sub=keys.filter(k=>k!==q&&k.startsWith(q+'/'));
 const pre=keys.filter(k=>k!==q&&!k.startsWith(q+'/')&&k.startsWith(q));
 let list=[...ex,...sub,...pre].slice(0,30);
 if(!list.length){out.innerHTML=`<div class="empty">“${E(q)}” नाम का कोई खसरा नहीं मिला।<br>नंबर दोबारा जाँचिए। उप-खसरे के लिए 1020/2 जैसा लिखिए।</div>`;return}
 const head=ex.length?`खसरा ${E(q)} मिला${list.length>1?` · ${list.length-1} मिलते-जुलते भी`:''}`:`${list.length} मिलते-जुलते खसरे`;
 out.innerHTML=`<div class="res">${head}</div>`+list.map(card).join('');
}
document.getElementById('go').onclick=run;
document.getElementById('q').addEventListener('input',run);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
